name: CI - Skills Monorepo Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene-and-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.11"

      - name: Verify Vendored Contracts & Libs Sync (Zero Drift)
        run: |
          python tools/vendor_shared.py --check

      - name: Hygiene & Security Audit (No Leaks, Size Budgets)
        run: |
          python tools/check_hygiene.py

      - name: Run Core I/O & Invariant Unit Tests
        run: |
          python -m unittest discover -s tools/tests -p "test_*.py"

      - name: Run Viethoa & Anti-Domestication Unit Tests
        run: |
          python -m unittest discover -s skills/viethoa/scripts/tests -p "test_*.py"

      - name: Run FontTV Custom Encoding Audit Tests
        run: |
          python skills/fonttv/scripts/tests/test_custom_encoding_audit.py

      - name: Lint viethoa Skill Package
        run: |
          python skills/viethoa/scripts/lint_skill_package.py skills/viethoa

  canary-runner:
    name: Canary Build (Latest Ubuntu Runner)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.11"

      - name: Run Core Test Discover
        run: |
          python -m unittest discover -s tools/tests -p "test_*.py"
          python -m unittest discover -s skills/viethoa/scripts/tests -p "test_*.py"
